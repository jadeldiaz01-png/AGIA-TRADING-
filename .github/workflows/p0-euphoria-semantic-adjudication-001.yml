name: p0-euphoria-semantic-adjudication-001

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Collect signature and semantic evidence
        run: |
          python -m agia_trading.euphoria_data.adjudicate_semantics \
            --out evidence/p0-euphoria-semantic-adjudication-001.json
      - name: Prove financial execution remains disabled
        run: |
          python - <<'PY'
          import json
          p=json.load(open('evidence/p0-euphoria-semantic-adjudication-001.json'))
          assert p['live_authorized'] is False
          assert p['max_autonomous_capital_usd'] == 0
          assert p['selector_semantics_verified'] is False
          assert p['event_semantics_verified'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p0-euphoria-semantic-adjudication-001-evidence
          path: evidence/p0-euphoria-semantic-adjudication-001.json
          if-no-files-found: error
