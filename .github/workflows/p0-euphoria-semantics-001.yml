name: p0-euphoria-semantics-001

on:
  pull_request:
    paths:
      - 'src/agia_trading/euphoria_data/**'
      - '.github/workflows/p0-euphoria-semantics-001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Collect semantic evidence read-only
        run: python -m agia_trading.euphoria_data.collect_semantics --out evidence/p0-euphoria-semantics-001.json
      - name: Prove financial execution remains disabled
        shell: python
        run: |
          import json
          from pathlib import Path
          evidence = json.loads(Path('evidence/p0-euphoria-semantics-001.json').read_text())
          assert evidence['live_authorized'] is False
          assert evidence['max_autonomous_capital_usd'] == 0
      - uses: actions/upload-artifact@v4
        with:
          name: p0-euphoria-semantics-001-evidence
          path: evidence/p0-euphoria-semantics-001.json
          if-no-files-found: error
