name: p0-euphoria-historical-tx-recovery-001

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-tx-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q tests/test_historical_tx_recovery.py
      - name: Recover four primary-RPC-missing historical bundles
        run: |
          python -m agia_trading.euphoria_data.historical_tx_recovery \
            --input evidence/p0-euphoria-missing-bundles-input.json \
            --out evidence/p0-euphoria-historical-tx-recovery-001.json
      - name: Prove fail-closed financial boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('evidence/p0-euphoria-historical-tx-recovery-001.json'))
          assert p['chain_id'] == 4326
          assert p['case_count'] == 4
          assert p['economic_semantics_verified'] is False
          assert p['deterministic_pnl_verified'] is False
          assert p['backfill_authorized'] is False
          assert p['paper_authorized'] is False
          assert p['testnet_authorized'] is False
          assert p['live_authorized'] is False
          assert p['max_autonomous_capital_usd'] == 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-euphoria-historical-tx-recovery-001-evidence
          path: evidence/p0-euphoria-historical-tx-recovery-001.json
          if-no-files-found: warn
          retention-days: 90
