name: p0-euphoria-redstone-signers-001

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signer-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Unit tests for signer verifier
        run: pytest -q tests/test_redstone_signers.py
      - name: Recover observed RedStone signers and query Euphoria policy
        run: |
          python -m agia_trading.euphoria_data.redstone_signers \
            --out evidence/p0-euphoria-redstone-signers-001.json
      - name: Prove fail-closed authorization boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('evidence/p0-euphoria-redstone-signers-001.json'))
          assert p['backfill_authorized'] is False
          assert p['paper_authorized'] is False
          assert p['testnet_authorized'] is False
          assert p['live_authorized'] is False
          assert p['max_autonomous_capital_usd'] == 0
          assert p['unresolved_count'] > 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p0-euphoria-redstone-signers-001-evidence
          path: evidence/p0-euphoria-redstone-signers-001.json
          if-no-files-found: error
          retention-days: 90
