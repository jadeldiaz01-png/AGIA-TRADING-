name: iqros-v0.5-evidence
on:
  push:
    branches: [main, feat/iqros-v0.5-production-evidence]
  pull_request:
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_iqros_v05_governance.py
      - name: Fail closed on self-authorization
        run: python - <<'PY'
          import json
          d=json.load(open('evidence/iqros-production-evidence-v2.json'))
          assert d['real_money_authorized'] is False
          assert d['production_ready'] is False
          PY
